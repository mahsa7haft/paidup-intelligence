# Local development stack for paidup-intelligence.
# Brings up the /ask app against a pgvector Postgres (seeded from docs/schema.sql)
# and a Redis L1 cache.
#
#   cp .env.example .env      # add OPENAI_API_KEY + ANTHROPIC_API_KEY first
#   docker compose up -d      # start db + redis + app
#   docker compose logs -f app
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop AND wipe the data volume
#
#   # one-shot ingestion into the local db (not part of `up`):
#   docker compose --profile ingest run --rm ingest
#
# For a full two-app VPS deployment (PaidUp + this) see deploy/ and DEPLOY.md.

services:
  db:
    # pgvector ships an official image: Postgres 16 with the vector extension built in.
    image: pgvector/pgvector:pg16
    container_name: intelligence-db
    environment:
      POSTGRES_USER: intelligence
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: intelligence
    ports:
      # host:container — connect from your machine at localhost:5433
      # (5433 not 5432, so it won't clash with any Postgres already on your host)
      - "5433:5432"
    volumes:
      # 1. Named volume — persists table data across `docker compose down`
      - intelligence_pgdata:/var/lib/postgresql/data
      # 2. Seed: any .sql in this dir runs ONCE, on first init of an empty data volume.
      #    Mounted read-only (:ro) so the container can't modify our schema file.
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Lets other services wait until Postgres is actually ready, not just started.
      test: ["CMD-SHELL", "pg_isready -U intelligence -d intelligence"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    # L1 query cache. Prebuilt image — like the db, we don't build this.
    image: redis:7
    container_name: intelligence-redis
    ports:
      # host:container — connect from your machine at localhost:6379
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: intelligence-app
    # API keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, THEYWORKFORYOU_API_KEY) come
    # from .env; the DB/Redis URLs below point at the compose services and
    # override anything in .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://intelligence:localdev@db:5432/intelligence
      REDIS_URL: redis://redis:6379/0
      PORT: "5003"
    ports:
      - "5003:5003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot ingestion. Not started by `up`; run explicitly:
  #   docker compose --profile ingest run --rm ingest
  ingest:
    build: .
    profiles: ["ingest"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://intelligence:localdev@db:5432/intelligence
    command: ["python", "-m", "app.ingest_all"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  intelligence_pgdata:
